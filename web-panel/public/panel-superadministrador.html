<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAEE Smart – Panel superadministrador</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --side:#0E3B27;--side2:#14502F;--side-txt:#CFE6D6;--lime:#7CC624;--green:#16883A;--green-d:#0F6A2D;
  --bg:#FFFFFF;--card:#FFFFFF;--line:#E4EAE5;--txt:#14261C;--muted:#5B6F61;--warn:#B8650B;--ok-bg:#E3F3E4;--bar-soft:#BFDCC5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45;display:flex}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

.side{width:248px;flex:none;background:var(--side);color:var(--side-txt);font-size:13px;display:flex;flex-direction:column;padding:16px 12px;height:100%;overflow-y:auto;z-index:20}
.brand{display:flex;align-items:center;gap:10px;background:#EEF7EF;border-radius:12px;padding:8px 14px 8px 8px;margin-bottom:18px}
.brand img{width:44px;height:44px;display:block}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--txt);line-height:1}
.brand b span{color:var(--green)}
.brand small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px}
.grp{font-size:10px;font-weight:600;color:#86AE95;margin:14px 10px 5px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--side-txt);padding:7px 9px;border-radius:8px;font-weight:500;font-size:12.5px}
.nav svg,.logout svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--side2)}
.nav button[aria-current="page"]{background:var(--lime);color:#0A2A19;font-weight:700}
.logout{margin-top:auto;padding-top:14px;border-top:1px solid #1E5A3A}
.logout button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:#F2C9C0;padding:7px 9px;border-radius:8px;font-weight:600;font-size:12.5px}
.logout button:hover{background:#3B2A25}

.main{flex:1;min-width:0;height:100%;overflow-y:auto}
.top{display:flex;align-items:center;gap:12px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;color:var(--txt)}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.top p{margin:0;color:var(--muted);font-size:13px}
.who{margin-left:auto;text-align:right;font-size:13px}
.who b{display:block;font-weight:700}
.who span{color:var(--muted)}
.wrap{padding:24px 28px 40px;display:grid;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.kpis .card{border:0;border-radius:0}
.kpi small{color:var(--muted);font-weight:600;font-size:13px}
.kpi strong{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
.kpi span{font-size:12.5px;color:var(--muted)}
h2{margin:0 0 14px;font-size:15px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.row h2{margin:0;margin-right:auto}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:18px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:0 10px 8px}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
td small{display:block;color:var(--muted);font-size:12px}
td.n,th.n{text-align:right}
.btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--green-d)}
.btn.o{background:none;color:var(--green-d);border:1px solid var(--green)}
.btn.o:hover{background:var(--ok-bg)}
.lnk{background:none;border:0;color:var(--green-d);font-weight:600;font-size:13px;padding:4px 6px;border-radius:6px}
.lnk:hover{background:var(--ok-bg)}
.lnk.r{color:#B8402B}.lnk.r:hover{background:#FBEDEA}
.st{font-weight:600}.st.on{color:var(--green-d)}.st.off{color:var(--muted)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:9px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i u{display:block;height:100%;background:var(--green);border-radius:99px}
.bar i s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--txt)}
.bar em{font-style:normal;font-weight:700;text-align:right}
.bar.low em{color:var(--warn)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .v{fill:var(--txt);font-weight:700}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
input,select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--txt);min-width:180px}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.note{color:var(--muted);font-size:12.5px;margin:12px 0 0}
.modal{position:fixed;inset:0;background:rgba(10,30,20,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal.on{display:flex}
.box{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:440px;display:grid;gap:14px}
.box h2{margin:0}
.box input{width:100%}
.box .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.err{color:#B8402B;font-size:12.5px;min-height:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#14261C;color:#fff;border-radius:10px;padding:11px 16px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols,.cols2{grid-template-columns:1fr}}
@media (max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
  .burger{display:block}
  .top,.wrap{padding-left:16px;padding-right:16px}
  .who{display:none}
}
@media (max-width:480px){.kpis{grid-template-columns:1fr}.bar{grid-template-columns:110px 1fr 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  cur=k;nav();
  $('#title').textContent=MENU.flatMap(m=>m[1]).find(i=>i[0]===k)[1];
  ({res,mun,rep,ia})[k]();
  closeMenu();$('.main').scrollTop=0;
}
function res(){
  const act=M.filter(m=>m.on),max=Math.max(...M.map(tot));
  const W=420,H=180,bw=40,gap=(W-40-bw*6)/5,base=H-26,mx=Math.max(...MESES.map(d=>d[1]));
  const cols=MESES.map((d,i)=>{const h=d[1]/mx*(base-34),x=20+i*(bw+gap),y=base-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${i===5?'var(--green)':'var(--bar-soft)'}"/><text class="v" x="${x+bw/2}" y="${y-5}" text-anchor="middle">${d[1]}</text><text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${d[0]}</text>`}).join('');
  const ct=CATS.map((n,i)=>[n,sum(M.map(m=>m.c[i]))]).sort((a,b)=>b[1]-a[1]);
  $('#view').innerHTML=`
  <section class="kpis">
    <div class="card kpi"><small>Entregas registradas</small><strong>${fmt(sum(M.map(tot)))}</strong><span>En todas las municipalidades</span></div>
    <div class="card kpi"><small>Pendientes por recibir</small><strong>${sum(M.map(m=>m.pend))}</strong><span>Entre todos los puntos</span></div>
    <div class="card kpi"><small>Kg de RAEE gestionados</small><strong>${fmt(sum(M.map(kg)))}</strong><span>Estimado según categoría</span></div>
    <div class="card kpi"><small>Municipalidades activas</small><strong>${act.length} de ${M.length}</strong><span>Con administrador asignado</span></div>
  </section>
  <section class="cols">
    <div class="card"><h2>Entregas por municipalidad</h2><div class="bars">${M.map(m=>`<div class="bar"><span>${esc(m.n.replace('Municipalidad de ',''))}</span><i><u style="width:${tot(m)/max*100}%"></u></i><em>${tot(m)}</em></div>`).join('')}</div></div>
    <div class="card chart"><h2>Entregas por mes (todas)</h2><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entregas por mes">${cols}<line x1="12" x2="${W-12}" y1="${base}" y2="${base}" stroke="var(--line)"/></svg></div>
  </section>
  <section class="card"><h2>Categorías más entregadas a nivel regional</h2><div class="bars">${ct.map(([n,v])=>`<div class="bar"><span>${n}</span><i><u style="width:${v/ct[0][1]*100}%"></u></i><em>${v}</em></div>`).join('')}</div></section>`;
}
function mun(){
  $('#view').innerHTML=`<section class="card"><div class="row"><h2>Municipalidades registradas (${M.length})</h2><button class="btn" id="add">Agregar municipalidad</button></div>
  <div class="tablewrap"><table><thead><tr><th>Municipalidad</th><th>Administrador</th><th class="n">Entregas</th><th class="n">Pendientes</th><th>Estado</th><th></th></tr></thead><tbody>`+
  M.map((m,i)=>`<tr><td><b>${esc(m.n)}</b><small>Provincia de ${esc(m.prov)}</small></td><td>${esc(m.adm)}<small>${esc(m.mail)}</small></td><td class="n">${tot(m)}</td><td class="n">${m.pend}</td><td><span class="st ${m.on?'on':'off'}">${m.on?'Activa':'Inactiva'}</span></td>
  <td style="text-align:right;white-space:nowrap"><button class="lnk" data-reset="${i}">Restablecer contraseña</button><button class="lnk ${m.on?'r':''}" data-tog="${i}">${m.on?'Desactivar':'Activar'}</button></td></tr>`).join('')+
  `</tbody></table></div><p class="note">El superadministrador gestiona municipalidades y cuentas. No ve datos personales de los ciudadanos.</p></section>`;
}
function rep(){
  const list=fm==='all'?M:M.filter((m,i)=>String(i)===fm);
  const idx=fc==='all'?CATS.map((_,i)=>i):[+fc];
  const rows=list.map(m=>({n:m.n,e:sum(idx.map(i=>m.c[i])),k:idx.reduce((s,i)=>s+m.c[i]*KG[i],0),p:m.pend}));
  $('#view').innerHTML=`<section class="card"><h2>Filtros del reporte</h2><div class="filters">
   <label>Municipalidad<select id="sm"><option value="all">Todas</option>${M.map((m,i)=>`<option value="${i}" ${fm==String(i)?'selected':''}>${esc(m.n.replace('Municipalidad de ',''))}</option>`).join('')}</select></label>
   <label>Categoría<select id="sc"><option value="all">Todas</option>${CATS.map((c,i)=>`<option value="${i}" ${fc==String(i)?'selected':''}>${c}</option>`).join('')}</select></label>
   <button class="btn" data-exp="Excel">Exportar a Excel</button><button class="btn o" data-exp="PDF">Exportar a PDF</button></div></section>
  <section class="card"><h2>Consolidado de entregas</h2><div class="tablewrap"><table><thead><tr><th>Municipalidad</th><th class="n">Entregas</th><th class="n">Kg estimados</th>${fc==='all'?'<th class="n">Pendientes</th>':''}</tr></thead><tbody>`+
  rows.map(r=>`<tr><td>${esc(r.n)}</td><td class="n">${r.e}</td><td class="n">${fmt(r.k)}</td>${fc==='all'?`<td class="n">${r.p}</td>`:''}</tr>`).join('')+
  `</tbody><tfoot><tr><td>Total</td><td class="n">${sum(rows.map(r=>r.e))}</td><td class="n">${fmt(sum(rows.map(r=>r.k)))}</td>${fc==='all'?`<td class="n">${sum(rows.map(r=>r.p))}</td>`:''}</tr></tfoot></table></div>
  <p class="note">El archivo exportado usa el formato de reporte para MINAM/SIGERSOL.</p></section>`;
}
function ia(){
  const avg=sum(PREC)/PREC.length;
  $('#view').innerHTML=`<section class="kpis">
    <div class="card kpi"><small>Precisión del modelo</small><strong>${avg.toFixed(1)}%</strong><span>Meta del proyecto: 80%</span></div>
    <div class="card kpi"><small>Correcciones manuales</small><strong>${(100-avg).toFixed(1)}%</strong><span>Los ciudadanos cambiaron la categoría</span></div>
    <div class="card kpi"><small>Categorías bajo la meta</small><strong>${PREC.filter(p=>p<80).length}</strong><span>Necesitan más fotos de entrenamiento</span></div>
    <div class="card kpi"><small>Fotos para reentrenar</small><strong>${fmt(sum(M.map(tot))*0.14)}</strong><span>Correcciones guardadas</span></div>
  </section>
  <section class="card"><h2>Precisión por categoría</h2><div class="bars">${CATS.map((n,i)=>`<div class="bar ${PREC[i]<80?'low':''}"><span>${n}</span><i><u style="width:${PREC[i]}%"></u><s style="left:80%"></s></i><em>${PREC[i]}%</em></div>`).join('')}</div>
  <p class="note">La línea oscura marca la meta de 80%. Las correcciones de los ciudadanos se usan para reentrenar el modelo.</p></section>`;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)}
function closeMenu(){$('#side').classList.remove('open');$('#scrim').classList.remove('on')}
function openModal(){['f1','f2','f3','f4'].forEach(i=>$('#'+i).value='');$('#err').textContent='';$('#modal').classList.add('on');$('#f1').focus()}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k)go(b.dataset.k);
  else if(b.id==='add')openModal();
  else if(b.dataset.tog!==undefined){const m=M[b.dataset.tog];m.on=!m.on;mun();toast(m.on?'Municipalidad activada':'Municipalidad desactivada')}
  else if(b.dataset.reset!==undefined){toast('Enlace para restablecer contraseña enviado a '+M[b.dataset.reset].mail)}
  else if(b.dataset.exp)toast('Reporte consolidado en '+b.dataset.exp+' generado');
});
document.addEventListener('change',e=>{if(e.target.id==='sm'){fm=e.target.value;rep()}if(e.target.id==='sc'){fc=e.target.value;rep()}});
$('#cancel').onclick=()=>$('#modal').classList.remove('on');
$('#save').onclick=()=>{
  const v=['f1','f2','f3','f4'].map(i=>$('#'+i).value.trim());
  if(v.some(x=>!x)){$('#err').textContent='Completa todos los campos.';return}
  if(!/^\S+@\S+\.\S+$/.test(v[3])){$('#err').textContent='Escribe un correo válido.';return}
  M.push({n:v[0],prov:v[1],adm:v[2],mail:v[3],on:true,pend:0,c:[0,0,0,0,0,0,0,0]});
  $('#modal').classList.remove('on');mun();
  toast('Municipalidad creada. Se envió el acceso a '+v[3]);
};
$('#burger').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('on')};
$('#scrim').onclick=closeMenu;
$('#logout').onclick=()=>toast('Sesión cerrada (demostración)');
$('#date').textContent=new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'});
go('res');
</script>
</body>
</html>
