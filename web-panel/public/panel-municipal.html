<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAEE Smart – Panel municipal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --side:#0E3B27;--side2:#14502F;--side-txt:#CFE6D6;--bar-soft:#BFDCC5;--lime:#7CC624;--green:#16883A;--green-d:#0F6A2D;
  --bg:#FFFFFF;--card:#FFFFFF;--line:#E4EAE5;--txt:#14261C;--muted:#5B6F61;--warn:#B8650B;--warn-bg:#FDF0DC;--ok-bg:#E3F3E4;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root{color-scheme:light}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45;display:flex}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* Sidebar */
.side{width:248px;flex:none;background:var(--side);color:var(--side-txt);font-size:13px;display:flex;flex-direction:column;padding:16px 12px;height:100%;overflow-y:auto;z-index:20}
.brand{display:flex;align-items:center;gap:10px;background:#EEF7EF;border-radius:12px;padding:8px 14px 8px 8px;margin-bottom:18px}
.brand img{width:44px;height:44px;display:block}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--txt);line-height:1}
.brand b span{color:var(--green)}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:4px}
.grp{font-size:10px;font-weight:600;color:#86AE95;margin:14px 10px 5px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;color:var(--side-txt);padding:7px 9px;border-radius:8px;font-weight:500;font-size:12.5px}
.nav button svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--side2)}
.nav button[aria-current="page"]{background:var(--lime);color:#0A2A19;font-weight:700}
.nav .count{margin-left:auto;background:#F3B34C;color:#3A2503;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.logout{margin-top:auto;padding-top:14px;border-top:1px solid #1E5A3A}
.logout button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:#F2C9C0;padding:7px 9px;border-radius:8px;font-weight:600;font-size:12.5px}
.logout button:hover{background:#3B2A25}
.logout svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Main */
.main{flex:1;min-width:0;height:100%;overflow-y:auto}
.top{display:flex;align-items:center;gap:12px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;color:var(--txt)}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.top p{margin:0;color:var(--muted);font-size:13px}
.who{margin-left:auto;text-align:right;font-size:13px}
.who b{display:block;font-weight:700}
.who span{color:var(--muted)}
.wrap{padding:24px 28px 40px;display:grid;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}.kpis .card{border:0;border-radius:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.kpi small{color:var(--muted);font-weight:600;font-size:13px}
.kpi strong{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.act strong{color:var(--green-d)}

.kpi.act button{margin-top:10px;background:none;color:var(--green-d);border:1px solid var(--green);border-radius:8px;padding:5px 12px;font-weight:600;font-size:13px}.kpi.act button:hover{background:var(--ok-bg)}
h2{margin:0 0 14px;font-size:15px;font-weight:700}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:18px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:0 10px 8px}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
td small{display:block;color:var(--muted);font-size:12px}
.tag{font-weight:500}
.btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--green-d)}
.empty{color:var(--muted);padding:22px 10px;text-align:center}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:130px 1fr 32px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i u{display:block;height:100%;background:var(--green);border-radius:99px}
.bar em{font-style:normal;font-weight:700;text-align:right}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .v{fill:var(--txt);font-weight:700}
.list{list-style:none;margin:0;padding:0;display:grid;gap:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0;padding-top:0}
.list small{color:var(--muted);display:block;font-size:12px}
.pill{font-size:13px;font-weight:600;color:var(--green-d);white-space:nowrap}

.ph{max-width:460px;margin:60px auto;text-align:center}
.ph h2{font-size:18px}
.ph p{color:var(--muted)}
.ph button{margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#14261C;color:#fff;border-radius:10px;padding:11px 16px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols,.cols2{grid-template-columns:1fr}}
@media (max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
  .burger{display:block}
  .top,.wrap{padding-left:16px;padding-right:16px}
  .who{display:none}
}
@media (max-width:480px){.kpis{grid-template-columns:1fr}.bar{grid-template-columns:100px 1fr 28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function dash(){
  const max=Math.max(...cats.map(c=>c[1]));
  const W=420,H=170,bw=34,gap=(W-40-bw*7)/6,top=20,base=H-26,mx=Math.max(...dias.map(d=>d[1]));
  const cols=dias.map((d,i)=>{const h=(d[1]/mx)*(base-top-12),x=20+i*(bw+gap),y=base-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${i===6?'var(--green)':'var(--bar-soft)'}"/><text class="v" x="${x+bw/2}" y="${y-5}" text-anchor="middle">${d[1]}</text><text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${d[0]}</text>`}).join('');
  $('#view').innerHTML=`
  <section class="kpis">
    <div class="card kpi"><small>Entregas recibidas hoy</small><strong id="k1">${hoy}</strong><span>+3 respecto a ayer</span></div>
    <div class="card kpi act"><small>Pendientes por recibir</small><strong id="k2">${pend.length}</strong><span>Esperan en tus puntos de entrega</span><button data-go="rec">Recibir aparatos</button></div>
    <div class="card kpi"><small>Entregados este mes</small><strong id="k3">${mes}</strong><span>Certificados emitidos</span></div>
    <div class="card kpi"><small>Kg de RAEE gestionados</small><strong>612</strong><span>Estimado del mes en curso</span></div>
  </section>
  <section class="cols">
    <div class="card"><h2>Entregas pendientes de recepción</h2><div class="tablewrap" id="tbl"></div></div>
    <div class="card"><h2>Entregas por categoría este mes</h2><div class="bars">${cats.map(([n,v])=>`<div class="bar"><span>${n}</span><i><u style="width:${v/max*100}%"></u></i><em>${v}</em></div>`).join('')}</div></div>
  </section>
  <section class="cols2">
    <div class="card chart"><h2>Entregas de los últimos 7 días</h2><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entregas por día">${cols}<line x1="12" x2="${W-12}" y1="${base}" y2="${base}" stroke="var(--line)"/></svg></div>
    <div class="card"><h2>Puntos con más movimiento</h2><ul class="list">
      <li><div>Plaza de Armas de Chiclayo<small>Lun a vie, 8:00 a 16:00</small></div><span class="pill">52 entregas</span></li>
      <li><div>Mercado Modelo<small>Lun a sáb, 8:00 a 17:00</small></div><span class="pill">41 entregas</span></li>
      <li><div>Parque Infantil<small>Mar, jue y sáb, 9:00 a 13:00</small></div><span class="pill">33 entregas</span></li>
      <li><div>Campaña “Reciclatón de otoño”<small>Del 24 al 26 de octubre</small></div><span class="pill">Habilitada</span></li>
    </ul></div>
  </section>`;
  table();
}
function table(){
  const t=$('#tbl');if(!t)return;
  t.innerHTML=pend.length?`<table><thead><tr><th>Código</th><th>Ciudadano</th><th>Categoría</th><th>Punto</th><th></th></tr></thead><tbody>`+
  pend.map(r=>`<tr><td><b>${r.c.slice(-8)}</b><small>${r.f}</small></td><td>${r.n}</td><td><span class="tag">${r.cat}</span></td><td>${r.p}</td><td><button class="btn" data-rec="${r.c}">Marcar como entregado</button></td></tr>`).join('')+`</tbody></table>`
  :`<div class="empty">No hay entregas pendientes. Cuando un ciudadano registre una nueva entrega, aparecerá aquí.</div>`;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3000)}
function closeMenu(){$('#side').classList.remove('open');$('#scrim').classList.remove('on')}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k)go(b.dataset.k);
  else if(b.dataset.go)go(b.dataset.go);
  else if(b.dataset.rec){
    const i=pend.findIndex(r=>r.c===b.dataset.rec);if(i<0)return;
    const r=pend.splice(i,1)[0];hoy++;mes++;
    nav();table();
    $('#k1').textContent=hoy;$('#k2').textContent=pend.length;$('#k3').textContent=mes;
    toast('Marcado como entregado: '+r.c.slice(-8)+'. Certificado con QR generado.');
  }
});
$('#burger').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('on')};
$('#scrim').onclick=closeMenu;
$('#logout').onclick=()=>toast('Sesión cerrada (demostración)');
$('#date').textContent=new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'});
go('dash');
</script>
</body>
</html>
