spring.application.name=backend

# --- Configuracion central (raiz del proyecto) ---
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# --- Servidor ---
server.port=${BACKEND_PORT:8080}

# --- Base de datos PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/RAEE_Smart}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Microservicio de IA ---
raeesmart.ia.base-url=${IA_BASE_URL:http://127.0.0.1:8000}

# --- Almacenamiento de fotos ---
raeesmart.almacenamiento.directorio=${UPLOADS_DIR:./uploads/raee-smart}

# --- JWT ---
raeesmart.jwt.secret=${JWT_SECRET:afSEWaHwDVAIuThpwrTvkT5SpNqa8rtsaajuKhXvHovHnNwgpao4my56URq2yIMh}
raeesmart.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Correo SMTP ---
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
raeesmart.correo.from=${SMTP_FROM:${SMTP_USERNAME:}}
raeesmart.correo.logo=${EMAIL_LOGO:email/logoRAEE.png}

# --- Recuperacion de contrasena ---
raeesmart.password-reset.secret=${PASSWORD_RESET_SECRET:raee-smart-password-reset-secret-cambiar-en-produccion}
raeesmart.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:10}
raeesmart.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}
raeesmart.password-reset.cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}

# --- CORS ---
raeesmart.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:19006,http://localhost:8081,http://127.0.0.1:8000}
raeesmart.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://10.*.*.*:*,http://192.168.*.*:*,http://172.*.*.*:*}

# --- Subida de archivos ---
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
raeesmart.certificado.verificacion-base-url=${CERT_VERIFICATION_BASE_URL:http://localhost:8080/api/certificados/verificar}
raeesmart.certificado.pdf-base-url=${CERT_PDF_BASE_URL:http://localhost:3007}
