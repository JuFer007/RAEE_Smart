spring.application.name=backend

# --- Base de datos PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/raeesmart
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Microservicio de IA (FastAPI) ---
raeesmart.ia.base-url=http://localhost:8001

# --- Certificados / QR ---
raeesmart.certificado.verificacion-base-url=http://localhost:8080/api/certificados/verificar

# --- Almacenamiento de fotos (local para el MVP) ---
raeesmart.almacenamiento.directorio=./uploads/raee-smart

# --- JWT ---
# El secret debe tener al menos 32 caracteres. Cambia este valor antes de producción.
raeesmart.jwt.secret=cambia-esta-clave-por-una-propia-de-al-menos-32-caracteres
raeesmart.jwt.expiration-ms=86400000

# --- CORS (solo afecta al panel municipal en React, que corre en navegador) ---
raeesmart.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:19006

# --- Subida de archivos ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
