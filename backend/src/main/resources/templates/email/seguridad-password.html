<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Aviso de seguridad - RAEE Smart</title>
</head>
<body style="margin:0;padding:0;background:#EEF9F2;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border-radius:14px;overflow:hidden;border:1px solid #D5E8DF;">
                <tr>
                    <td th:replace="~{email/fragments/cabecera :: cabecera}"></td>
                </tr>
                <tr>
                    <td style="padding:26px 28px 12px;">
                        <h1 style="margin:0 0 10px;color:#103B35;font-size:21px;">Tu contraseña fue cambiada</h1>
                        <p style="margin:0;color:#22584C;font-size:14px;line-height:1.6;">
                            Hola <strong th:text="${nombre}">ciudadano</strong>, la contraseña de tu cuenta RAEE Smart se cambió correctamente.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:10px 28px 18px;">
                        <table width="100%" cellpadding="0" cellspacing="0" style="background:#F8FCFA;border:1px solid #E1EEE7;border-radius:10px;">
                            <tr>
                                <td style="padding:14px 16px;color:#22584C;font-size:14px;line-height:1.7;">
                                    <p style="margin:0 0 8px;"><strong style="color:#087C4B;">Fecha y hora:</strong> <span th:text="${fechaHora}">22/11/2026 10:00</span></p>
                                    <p style="margin:0 0 8px;"><strong style="color:#087C4B;">Dispositivo:</strong> <span th:text="${dispositivo}">App móvil Android</span></p>
                                    <p style="margin:0;"><strong style="color:#087C4B;">Dirección IP:</strong> <span th:text="${ip}">192.168.1.10</span></p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 28px 24px;text-align:center;">
                        <p style="margin:0;color:#B3261E;font-size:12px;">Si no fuiste tú, cambia tu contraseña de inmediato y contacta al soporte.</p>
                    </td>
                </tr>
                <tr>
                    <td th:replace="~{email/fragments/pie :: pie}"></td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
