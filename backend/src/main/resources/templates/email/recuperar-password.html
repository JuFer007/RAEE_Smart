<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Recuperación de contraseña - RAEE Smart</title>
</head>
<body style="margin:0;padding:0;background:#EEF9F2;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border-radius:14px;overflow:hidden;border:1px solid #D5E8DF;">
                <tr>
                    <td th:replace="~{email/fragments/cabecera :: cabecera}"></td>
                </tr>
                <tr>
                    <td style="padding:26px 28px 12px;text-align:center;">
                        <h1 style="margin:0 0 10px;color:#103B35;font-size:21px;">Recuperación de contraseña</h1>
                        <p style="margin:0;color:#22584C;font-size:14px;line-height:1.6;">
                            Hola <strong th:text="${nombre}">ciudadano</strong>,<br>
                            Recibimos una solicitud para restablecer tu contraseña. Usa el siguiente código en la app móvil para continuar.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:10px 28px 18px;">
                        <table width="100%" cellpadding="0" cellspacing="0" style="background:#E1F5E9;border-left:4px solid #079150;border-radius:10px;">
                            <tr>
                                <td align="center" style="padding:20px 12px;">
                                    <p style="margin:0 0 8px;color:#087C4B;font-size:11px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;">Tu código de recuperación</p>
                                    <span th:text="${codigo}" style="color:#103B35;font-family:'Courier New',monospace;font-size:32px;font-weight:bold;letter-spacing:8px;">000000</span>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 28px 24px;text-align:center;">
                        <p style="margin:0;color:#709087;font-size:12px;">Este código expira en <strong th:text="${minutos}">10</strong> minutos.</p>
                    </td>
                </tr>
                <tr>
                    <td th:replace="~{email/fragments/pie :: pie}"></td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
