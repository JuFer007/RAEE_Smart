<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Punto de acopio - RAEE Smart</title>
</head>
<body style="margin:0;padding:0;background:#EEF9F2;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border-radius:14px;overflow:hidden;border:1px solid #D5E8DF;">
                <tr>
                    <td th:replace="~{email/fragments/cabecera :: cabecera}"></td>
                </tr>
                <tr>
                    <td style="padding:26px 28px 12px;">
                        <h1 style="margin:0 0 10px;color:#103B35;font-size:21px;">Punto de acopio actualizado</h1>
                        <p style="margin:0;color:#22584C;font-size:14px;line-height:1.6;">
                            Hola <strong th:text="${nombre}">ciudadano</strong>, <span th:text="${accion}">se actualizó un punto de acopio</span> cerca de ti.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:10px 28px 18px;">
                        <table width="100%" cellpadding="0" cellspacing="0" style="background:#E1F5E9;border-left:4px solid #079150;border-radius:10px;">
                            <tr>
                                <td style="padding:14px 16px;color:#103B35;font-size:14px;line-height:1.7;">
                                    <p style="margin:0 0 8px;"><strong style="color:#087C4B;">Punto:</strong> <span th:text="${punto}">Punto Central</span></p>
                                    <p style="margin:0 0 8px;"><strong style="color:#087C4B;">Dirección:</strong> <span th:text="${direccion}">Av. Principal 123</span></p>
                                    <p style="margin:0;"><strong style="color:#087C4B;">Horario:</strong> <span th:text="${horario}">Lunes a viernes de 8:00 a 17:00</span></p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 28px 24px;text-align:center;">
                        <p style="margin:0;color:#709087;font-size:12px;">La información también está disponible en la sección de puntos de acopio.</p>
                    </td>
                </tr>
                <tr>
                    <td th:replace="~{email/fragments/pie :: pie}"></td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
